name: Bug report
description: Report a reproducible bug
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include secrets, tokens or personal data. For security issues see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Code, commands, config (redact secrets)
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "P2PLink, Node, browser, broker"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Redact tokens and payloads
    validations:
      required: false
