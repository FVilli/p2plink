# Demo-only broker. TLS is intentionally terminated outside this container
# in production; this file is for localhost demonstrations only.
persistence false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/aclfile
max_packet_size 524288
message_size_limit 524288
log_type information

listener 1884 0.0.0.0

listener 9002 0.0.0.0
protocol websockets
