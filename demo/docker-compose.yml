services:
  demo-backend:
    image: ghcr.io/fvilli/p2plink-demo:latest
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      MQTT_URL: mqtts://mqtt.fvsg.it:8883
      MQTT_USERNAME: main:rmq-usr
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in demo/.env}
      PEER_NAME: ${PEER_NAME:-nest-docker}
      PING_BYTES: ${PING_BYTES:-2048}
      APP_VERSION: ${APP_VERSION:-0.2.0}
      PORT: 3100
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
