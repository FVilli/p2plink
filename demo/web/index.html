<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>P2PLink Mesh</title>
    <meta name="theme-color" content="#10141c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="offline-banner" class="offline-banner" hidden>
      Sei offline: l'app è aperta dalla cache PWA. La mesh riprenderà quando torni online.
    </div>
    <main>
      <header>
        <div>
          <h1>P2PLink Mesh <span id="app-version" class="version"></span></h1>
          <p>Browser peer network</p>
        </div>
        <span id="broker-state" data-connected="false">
          <span id="broker-dot">⚪</span> <strong>MQTT</strong>
          <small id="broker-url">—</small>
        </span>
      </header>
      <section class="self">
        <div class="self-identity">
          <strong>Self peer</strong>
          <span id="self-peer">Starting…</span>
        </div>
        <div class="self-actions">
          <button
            id="logout"
            class="icon-button"
            type="button"
            title="Logout"
            aria-label="Logout"
            hidden
          >
            🚪
          </button>
          <button
            id="reset-stats"
            class="icon-button"
            type="button"
            title="Reset statistiche"
            aria-label="Reset statistiche"
            disabled
          >
            ↺
          </button>
        </div>
      </section>
      <section id="auth-panel" class="config" hidden>
        <form id="auth-form">
          <h2 id="auth-title">Sign in</h2>
          <label>Email</label><input id="auth-email" type="email" autocomplete="email" required />
          <label id="auth-password-label">Password</label
          ><input id="auth-password" type="password" autocomplete="current-password" required />
          <label id="auth-friendly-label">Client name</label
          ><input id="auth-friendly" type="text" maxlength="50" placeholder="monster" />
          <label id="auth-token-label" hidden>Email token</label
          ><input id="auth-token" type="text" autocomplete="one-time-code" hidden />
          <label id="auth-new-password-label" hidden>New password</label
          ><input id="auth-new-password" type="password" autocomplete="new-password" hidden />
          <p id="auth-error" class="config-error" role="alert"></p>
          <button id="auth-submit" type="submit">Continue</button>
          <div class="auth-modes">
            <button id="auth-signin" class="auth-mode auth-signin" type="button">🔑 Sign in</button>
            <button id="auth-register" class="auth-mode auth-create" type="button">
              ✨ Create
            </button>
            <button id="auth-forgot" class="auth-mode auth-forgot" type="button">🔐 Forgot</button>
            <button id="auth-resend" class="auth-mode auth-resend" type="button">📨 Resend</button>
          </div>
        </form>
      </section>

      <div id="error" role="alert" hidden></div>
      <section class="totals" id="totals"></section>
      <h2 class="section-title">🔗 Connected peers</h2>
      <div class="table-wrap">
        <table id="peers">
          <thead>
            <tr>
              <th>Peer</th>
              <th>Route</th>
              <th>RTT ms</th>
              <th>P2P bytes</th>
              <th>P2P msgs</th>
              <th>MQTT bytes</th>
              <th>MQTT msgs</th>
              <th>P2P B/s</th>
              <th>MQTT B/s</th>
              <th>Pings</th>
              <th>OK</th>
              <th>Last error</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <section class="issues" id="issues" hidden>
        <h2 class="section-title">🐞 Problemi recenti</h2>
        <ul id="issue-list"></ul>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
