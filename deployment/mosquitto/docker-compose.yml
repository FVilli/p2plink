services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: p2plink-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./aclfile:/mosquitto/config/aclfile:ro
      - ./passwd:/mosquitto/config/passwd:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -u p2plink-server -P server-dev-password -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 5s
      timeout: 4s
      retries: 10
